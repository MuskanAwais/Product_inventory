<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Inventory</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <h1>Product Inventory</h1>
      <p>Manage products and categories</p>
    </div>
  </header>

  <main class="wrap">
    <p id="status" class="status" hidden></p>

    <section class="panel">
      <div class="panel-head">
        <h2>Categories</h2>
      </div>
      <form id="categoryForm" class="row-form">
        <input id="categoryName" type="text" placeholder="Category name" required />
        <input id="categoryDescription" type="text" placeholder="Description (optional)" />
        <button type="submit">Add Category</button>
      </form>
      <ul id="categoryList" class="simple-list"></ul>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Products</h2>
        <input id="searchInput" type="search" placeholder="Search by name..." />
      </div>

      <form id="productForm" class="grid-form">
        <input type="hidden" id="productId" />
        <label>
          Name
          <input id="productName" type="text" required />
        </label>
        <label>
          Description
          <input id="productDescription" type="text" />
        </label>
        <label>
          Price
          <input id="productPrice" type="number" min="0" step="0.01" required />
        </label>
        <label>
          Quantity
          <input id="productQuantity" type="number" min="0" step="1" required />
        </label>
        <label>
          Category
          <select id="productCategoryId" required></select>
        </label>
        <div class="form-actions">
          <button type="submit" id="saveProductBtn">Add Product</button>
          <button type="button" id="cancelEditBtn" class="secondary" hidden>Cancel</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
            <tr><td colspan="5">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
